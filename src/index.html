<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <!-- Viewport — prevents iOS zoom on input focus -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>Belenergy Support Pro</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFD700" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Belenergy" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
  <link rel="apple-touch-startup-image" href="/icons/icon-512x512.svg" />

  <!-- Android Chrome -->
  <meta name="application-name" content="Belenergy" />
  <meta name="msapplication-TileColor" content="#FFD700" />

  <!-- SEO / share -->
  <meta name="description" content="Sistema de Gestão de Chamados Técnicos — Energia Solar" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Plotly (charts) -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- App -->
  <link rel="stylesheet" href="/assets/main.css">
  <script type="module" src="/assets/main.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Failed:', err));
      });
    }
  </script>
</body>
</html>
